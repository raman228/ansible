- name: play level variables
  hosts: local
  connection: local # Ansible is connection to localhost.
  vars:
    COURSE: Ansible
    DURATION: 10HRS
    Trainers: Sivakumar reddy.
  tasks:
  - name: print the course info
    ansible.builtin.debug:
      msg: "Couse Name is: {{ COURSE }}, Duration: {{DURATION}}, Trainers: {{Trainers}}"
      